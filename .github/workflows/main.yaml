name: execute experiments

# Define quando o script será acionado
on:   
  workflow_dispatch:
    inputs:
      experiment_name:
        description: 'running src/main.py'
        required: false
        default: 'default_experiment'

jobs:
  github-execution:
    # Este é o runner padrão (CPU Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5 # Atualizado para v5
        with:
          python-version: '3.11'
          cache: 'pip' # OTIMIZAÇÃO: Cache automático de dependências

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar script principal
        run: python src/main.py